<g><rect x="308" y="128" width="84" height="34" rx="17" fill="#2c2c2e" stroke="#3a3a3c"/><text x="350.4" y="150" font-size="14" font-weight="500" text-anchor="middle" class="ink" >通义千问</text></g>
<g><rect x="402" y="128" width="112" height="34" rx="17" fill="#2c2c2e" stroke="#3a3a3c"/><text x="458.4" y="150" font-size="14" font-weight="500" text-anchor="middle" class="ink" >OpenRouter</text></g>
<g><rect x="524" y="128" width="78" height="34" rx="17" fill="#2c2c2e" stroke="#3a3a3c"/><text x="563.6" y="150" font-size="14" font-weight="500" text-anchor="middle" class="ink" >OpenAI</text></g>
