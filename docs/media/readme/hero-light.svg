<text x="440" y="188" font-size="62" font-weight="700" text-anchor="middle" class="ink" letter-spacing="-1.5">TypeLeast</text>
<text x="440" y="240" font-size="32" font-weight="600" text-anchor="middle" class="ink" letter-spacing="0.5">说出来，就写好了。</text>
<text x="440" y="276" font-size="17" font-weight="400" text-anchor="middle" class="gray" >按一下说话，再按一下——整理好的文字直接出现在光标处。</text>
<rect x="110" y="314" width="660" height="124" rx="24" fill="#f5f5f7"/>
<text x="138" y="346" font-size="13" font-weight="500" text-anchor="start" class="faint" >任意输入框</text>
<g class="raw">
<text x="138" y="398" font-size="17" font-weight="400" text-anchor="start" class="faint" >嗯那个，</text>
<rect class="left strike" x="138" y="392" width="68" height="1.6" rx="0.8" fill="#ff3b30"/>
<text x="206" y="398" font-size="17" font-weight="400" text-anchor="start" class="faint" >明天，不对，</text>
<rect class="left strike" x="206" y="392" width="102" height="1.6" rx="0.8" fill="#ff3b30"/>
<text x="308" y="398" font-size="17" font-weight="400" text-anchor="start" class="gray" >后天下午三点开会，</text>
<text x="461" y="398" font-size="17" font-weight="400" text-anchor="start" class="faint" >然后</text>
<rect class="left strike" x="461" y="392" width="34" height="1.6" rx="0.8" fill="#ff3b30"/>
<text x="495" y="398" font-size="17" font-weight="400" text-anchor="start" class="gray" >会前把报告发给大家</text>
<text x="742" y="346" font-size="13" font-weight="500" text-anchor="end" class="faint" >你说的</text>
</g>
<g class="final">
<text x="138" y="399" font-size="21" font-weight="500" text-anchor="start" class="ink" >后天下午三点开会，会前把报告发给大家。</text>
<text x="742" y="346" font-size="13" font-weight="600" text-anchor="end" class="blue" >写进去的</text>
</g>
