name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service:
    name: Service tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node scripts/check-redaction.mjs
      - run: node scripts/check-facts.mjs
      - run: node scripts/check-localization.mjs

  macos:
    name: macOS app (tests and build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: apps/macos/test.sh
      - run: apps/macos/build.sh --no-install

  windows:
    name: Windows app (tests and build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project TypeLeast.Core.Tests -c Release
      - run: dotnet build TypeLeast/TypeLeast.csproj -c Release
