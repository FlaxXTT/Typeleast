name: CI

# Manual only: run it on a branch before merging. Releases are built by release.yml.
# Automatic runs would also need "[skip ci]" in commits, which Cloudflare honours
# too and would then skip deploying the site.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service:
    name: Service tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node scripts/check-redaction.mjs
      - run: node scripts/check-facts.mjs
      - run: node scripts/check-localization.mjs

  macos:
    name: macOS app (tests and build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: apps/macos/test.sh
      - run: apps/macos/build.sh --no-install

  speech-models:
    name: Real ASR models (${{ matrix.os }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/typeleast-asr-models
          key: asr-v1-${{ runner.os }}-${{ hashFiles('service/lib/asr-catalog.json', 'service/lib/models.js') }}
      - name: Download, verify, load and recognize with each model in order
        run: node scripts/check-asr-models.mjs --download --models-dir "${{ runner.temp }}/typeleast-asr-models" --state-dir "${{ runner.temp }}/typeleast-asr-state"

  windows:
    name: Windows app (tests and build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project TypeLeast.Core.Tests -c Release
      - run: dotnet build TypeLeast/TypeLeast.csproj -c Release

  windows-render:
    name: Windows UI renders (design review)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Render
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "render"
          New-Item -ItemType Directory -Force $out | Out-Null
          dotnet run --project apps/windows/Tools/MediaRenderer -c Release -- $out update-only
      - uses: actions/upload-artifact@v4
        with:
          name: windows-render
          path: ${{ runner.temp }}/render/*.png
          if-no-files-found: error
