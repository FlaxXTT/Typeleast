name: Release signing check

# Check the configured publisher identity without building or publishing a release.
# Only public certificate fingerprints and setup/cleanup status reach the log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing:
    name: Validate persistent macOS publisher identity
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import and validate the configured publisher identity
        timeout-minutes: 2
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: bash apps/macos/scripts/setup-release-signing.sh
      - name: Remove temporary signing material
        if: always()
        timeout-minutes: 2
        run: bash apps/macos/scripts/cleanup-release-signing.sh
