name: macOS settings scroll

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: apps/macos/test.sh
      - name: Exercise General scrolling and status refresh
        run: |
          render_dir="$(mktemp -d /private/tmp/typeleast-settings-render.XXXXXX)"
          export TYPELEAST_HOME="$(mktemp -d /private/tmp/typeleast-settings-home.XXXXXX)"
          echo "TYPELEAST_SETTINGS_RENDER=$render_dir" >> "$GITHUB_ENV"
          apps/macos/build/typeleast-tests --settings-scroll-check "$render_dir"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-settings-scroll
          path: ${{ env.TYPELEAST_SETTINGS_RENDER }}/*.png
          if-no-files-found: warn
