name: Sign local TypeLeast preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release to use as the base bundle
        required: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the official app bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [ "$TAG" = v2.1.13 ]
          mkdir -p "$RUNNER_TEMP/preview"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'TypeLeast-2.1.13-macOS14-AppleSilicon.zip' --dir "$RUNNER_TEMP/preview"
          /usr/bin/ditto -x -k "$RUNNER_TEMP/preview/TypeLeast-2.1.13-macOS14-AppleSilicon.zip" "$RUNNER_TEMP/preview"
      - name: Compile the updated app executable
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/preview/TypeLeast.app"
          /usr/bin/swiftc -swift-version 5 -O -target arm64-apple-macosx14.0 \
            -framework AppKit -framework SwiftUI -framework AVFoundation \
            -framework CoreAudio -framework Carbon -framework ServiceManagement -framework Foundation \
            -o "$RUNNER_TEMP/preview/TypeLeast" apps/macos/Sources/*.swift
          cp "$RUNNER_TEMP/preview/TypeLeast" "$app/Contents/MacOS/TypeLeast"
          /usr/bin/ditto apps/macos/Resources/Fonts "$app/Contents/Resources/Fonts"
      - name: Import persistent publisher signing identity
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: bash apps/macos/scripts/setup-release-signing.sh
      - name: Sign the preview with the publisher
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/preview/TypeLeast.app"
          /usr/bin/codesign --force --sign "$TYPELEAST_SIGN_IDENTITY" --timestamp=none \
            --options runtime --entitlements apps/macos/TypeLeast.entitlements "$app"
          /usr/bin/codesign --verify --deep --strict "$app"
          /usr/bin/ditto -c -k --keepParent "$app" "$RUNNER_TEMP/preview/TypeLeast-2.1.13-enlarged-heatmap-preview.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-enlarged-heatmap-preview
          path: ${{ runner.temp }}/preview/TypeLeast-2.1.13-enlarged-heatmap-preview.zip
          retention-days: 1
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: bash apps/macos/scripts/cleanup-release-signing.sh
